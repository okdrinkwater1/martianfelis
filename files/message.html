    <main>
        <h1>send me a note!</h1>

        <form id="contact_form" action="https://formspree.io/f/meaovono" method="POST">
            <label for="name">your name, traveller?</label>
            <input id="name" name="name" type="text">

            <label for="email">return address</label>
            <input id="email" name="email" type="email">

            <label for="message">beam me a message.</label>
            <textarea name="message" id="message" rows="5"></textarea>
            
            <input type="text" name="_gotcha" class="hidden" class="hidden" tabindex="-1" autocomplete="off">

            <button type="submit">send</button>
            <p id="form_status" role="status"></p>
        </form>
    </main>
    <footer>
        <p>coded with my fingers</p>
    </footer>
